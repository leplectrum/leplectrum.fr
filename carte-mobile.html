<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carte — Le Plectrum</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f2eee7;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header strong {
    color: #ef6864;
    font-size: 24px;
    letter-spacing: 3px;
}

header p {
    margin: 8px 0 0;
    color: #aaa;
    font-size: 13px;
}

.menu {
    max-width: 900px;
    margin: auto;
    padding: 20px 10px 50px;
}

.page {
    background: white;
    margin-bottom: 25px;
    border-radius: 7px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    border-top: 4px solid #ef6864;
}

.page-title {
    padding: 15px;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 1px;
}

.page-number {
    color: #ef6864;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 5px;
}

.page img {
    display: block;
    width: 100%;
    height: auto;
}

.back {
    text-align: center;
    padding: 10px 15px 35px;
}

.back a {
    display: inline-block;
    padding: 14px 22px;
    background: #ef6864;
    color: #111;
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
}

@media (max-width: 600px) {

    .menu {
        padding: 12px 6px 40px;
    }

    .page {
        margin-bottom: 18px;
        border-radius: 5px;
    }

    .page-title {
        font-size: 17px;
    }

}

</style>
</head>

<body>

<header>

    <strong>
        LE PLECTRUM
    </strong>

    <p>
        NOTRE CARTE
    </p>

</header>


<main class="menu">


    <!-- =========================
         PAGE 1
    ========================== -->

    <section class="page">

        <div class="page-title">

            <div class="page-number">
                01
            </div>

            BIÈRES & BOISSONS

        </div>

        <img
            src="01-bieres.jpg"
            alt="Carte Le Plectrum — Bières et boissons"
        >

    </section>


    <!-- =========================
         PAGE 2
    ========================== -->

    <section class="page">

        <div class="page-title">

            <div class="page-number">
                02
            </div>

            COCKTAILS

        </div>

        <img
            src="02-cocktails.jpg"
            alt="Carte Le Plectrum — Cocktails"
        >

    </section>


    <!-- =========================
         PAGE 3
    ========================== -->

    <section class="page">

        <div class="page-title">

            <div class="page-number">
                03
            </div>

            TAPAS & PLATS

        </div>

        <img
            src="03-tapas.jpg"
            alt="Carte Le Plectrum — Tapas et plats"
        >

    </section>


    <!-- =========================
         PAGE 4
    ========================== -->

    <section class="page">

        <div class="page-title">

            <div class="page-number">
                04
            </div>

            DESSERTS

        </div>

        <img
            src="04-desserts.jpg"
            alt="Carte Le Plectrum — Desserts"
        >

    </section>


    <div class="back">

        <a href="index.html">
            ← RETOUR AU PLECTRUM
        </a>

    </div>


</main>

</body>
</html>
